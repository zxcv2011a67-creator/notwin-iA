<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notwin iA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f0d;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
    }

    .header {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #202722;
      background: #0b0f0d;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #19d66b;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #ddd;
      font-size: 22px;
      cursor: pointer;
    }

    .icon-btn:active {
      background: #202722;
    }

    .chat {
      padding: 25px 15px 150px;
    }

    .welcome {
      text-align: center;
      padding: 55px 15px 35px;
    }

    .orb {
      width: 64px;
      height: 64px;
      margin: auto auto 18px;
      border-radius: 50%;
      background: #19d66b;
      color: #07120b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 0 35px rgba(25, 214, 107, .25);
    }

    .welcome h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .welcome h1 span {
      color: #19d66b;
    }

    .welcome p {
      color: #8f9992;
      font-size: 14px;
      line-height: 1.8;
    }

    .message {
      display: flex;
      margin: 18px 0;
      line-height: 1.8;
      font-size: 15px;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 88%;
      padding: 12px 15px;
      border-radius: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #19d66b;
      color: #06120a;
      border-bottom-left-radius: 5px;
    }

    .ai .bubble {
      background: #171c19;
      border: 1px solid #252d28;
      color: #f1f4f2;
      border-bottom-right-radius: 5px;
    }

    .image-message {
      max-width: 92%;
    }

    .generated-image {
      width: 100%;
      max-width: 500px;
      border-radius: 18px;
      display: block;
      border: 1px solid #303a33;
    }

    .typing {
      display: none;
      color: #7d8a82;
      font-size: 13px;
      padding: 5px 18px;
    }

    .input-wrapper {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 100%);
      padding: 12px 14px 18px;
      background: linear-gradient(
        transparent,
        #0b0f0d 25%
      );
      z-index: 15;
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #171c19;
      border: 1px solid #303a33;
      border-radius: 26px;
      padding: 7px;
    }

    .input-area input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 11px 5px;
      text-align: right;
      min-width: 0;
    }

    .input-area input::placeholder {
      color: #737d76;
    }

    .send,
    .attach {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send {
      background: #19d66b;
      color: #06120a;
      font-size: 20px;
    }

    .send:active {
      transform: scale(.94);
    }

    .attach {
      background: transparent;
      color: #9aa49e;
      font-size: 20px;
    }

    .send:disabled {
      opacity: .45;
      cursor: default;
    }

    .attach:active {
      background: #202722;
    }

    /* القائمة */

    .sidebar {
      position: fixed;
      top: 0;
      right: -310px;
      width: 300px;
      height: 100vh;
      background: #111613;
      border-left: 1px solid #252d28;
      z-index: 100;
      transition: right .25s;
      padding: 18px;
      overflow-y: auto;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .sidebar-title {
      font-size: 19px;
      font-weight: bold;
    }

    .new-chat {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: 1px solid #19d66b;
      background: transparent;
      color: #19d66b;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .conversation {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 7px;
      background: #171c19;
      cursor: pointer;
    }

    .conversation.active {
      border: 1px solid #19d66b;
    }

    .conversation-title {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .delete-chat {
      border: 0;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 16px;
    }

    .delete-chat:active {
      color: #ff5555;
    }

    .empty-chats {
      text-align: center;
      color: #737d76;
      padding: 30px 10px;
      font-size: 13px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      z-index: 90;
    }

    .overlay.show {
      display: block;
    }

    /* الصور */

    .image-panel {
      display: none;
      position: fixed;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      width: min(500px, 92%);
      background: #171c19;
      border: 1px solid #303a33;
      border-radius: 18px;
      padding: 15px;
      z-index: 30;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }

    .image-panel.show {
      display: block;
    }

    .image-panel-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .image-panel input {
      width: 100%;
      background: #0b0f0d;
      border: 1px solid #303a33;
      border-radius: 12px;
      color: white;
      padding: 12px;
      outline: none;
      margin-bottom: 10px;
    }

    .generate-button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #19d66b;
      color: #06120a;
      font-weight: bold;
      cursor: pointer;
    }

    .generate-button:disabled {
      opacity: .5;
    }

    @media(max-width:600px) {
      .chat {
        padding-left: 10px;
        padding-right: 10px;
      }

      .sidebar {
        width: 285px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <button
      id="menuButton"
      class="icon-btn"
      type="button">
      ☰
    </button>

    <div class="logo">
      notwin <span>iA</span>
    </div>

    <button
      class="icon-btn"
      type="button">
      ◉
    </button>

  </header>

  <main
    id="chat"
    class="chat">

    <section
      id="welcome"
      class="welcome">

      <div class="orb">✦</div>

      <h1>
        مرحباً بك في
        <span>notwin iA</span>
      </h1>

      <p>
        مساعدك الذكي للبرمجة، الكتابة، التعلم والأفكار.
      </p>

    </section>

  </main>

  <div
    id="typing"
    class="typing">
    notwin iA يكتب...
  </div>

  <div class="input-wrapper">

    <div class="input-area">

      <button
        id="imageButton"
        class="attach"
        type="button">
        🖼️
      </button>

      <input
        id="messageInput"
        type="text"
        placeholder="اكتب رسالتك..."
        autocomplete="off">

      <button
        id="sendButton"
        class="send"
        type="button">
        ↑
      </button>

    </div>

  </div>

</div>


<!-- القائمة -->

<div
  id="overlay"
  class="overlay">
</div>

<aside
  id="sidebar"
  class="sidebar">

  <div class="sidebar-header">

    <div class="sidebar-title">
      💬 محادثاتك
    </div>

    <button
      id="closeMenu"
      class="icon-btn"
      type="button">
      ×
    </button>

  </div>

  <button
    id="newChatButton"
    class="new-chat"
    type="button">
    ＋ محادثة جديدة
  </button>

  <div id="conversationList"></div>

</aside>


<!-- لوحة توليد الصور -->

<div
  id="imagePanel"
  class="image-panel">

  <div class="image-panel-title">
    🖼️ توليد صورة
  </div>

  <input
    id="imagePrompt"
    type="text"
    placeholder="مثلاً: سيارة رياضية سوداء في الليل">

  <button
    id="generateButton"
    class="generate-button"
    type="button">
    ✨ توليد الصورة
  </button>

</div>


<script>

"use strict";


/* =========================
   إعداد السيرفر
========================= */

const API_URL =
  "https://notwin-ia-1.onrender.com";


/* =========================
   عناصر الصفحة
========================= */

const input =
  document.getElementById("messageInput");

const chat =
  document.getElementById("chat");

const typing =
  document.getElementById("typing");

const sendButton =
  document.getElementById("sendButton");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const conversationList =
  document.getElementById("conversationList");

const imagePanel =
  document.getElementById("imagePanel");

const imagePrompt =
  document.getElementById("imagePrompt");

const generateButton =
  document.getElementById("generateButton");

const imageButton =
  document.getElementById("imageButton");

const menuButton =
  document.getElementById("menuButton");

const closeMenu =
  document.getElementById("closeMenu");

const newChatButton =
  document.getElementById("newChatButton");


/* =========================
   المحادثات
========================= */

let conversations = [];

try {

  conversations =
    JSON.parse(
      localStorage.getItem(
        "notwin_conversations"
      ) || "[]"
    );

  if (!Array.isArray(conversations)) {
    conversations = [];
  }

} catch (error) {

  console.error(
    "LocalStorage error:",
    error
  );

  conversations = [];

}


let currentConversationId = null;


/* =========================
   الحفظ
========================= */

function saveConversations() {

  try {

    localStorage.setItem(
      "notwin_conversations",
      JSON.stringify(conversations)
    );

  } catch (error) {

    console.error(
      "Save error:",
      error
    );

  }

}


/* =========================
   العنوان
========================= */

function getTitle(text) {

  const clean =
    String(text)
      .replace(/\s+/g, " ")
      .trim();

  if (!clean) {
    return "محادثة جديدة";
  }

  if (clean.length <= 30) {
    return clean;
  }

  return clean.substring(0, 30) + "...";

}


/* =========================
   إنشاء محادثة
========================= */

function createConversation() {

  const conversation = {

    id:
      Date.now().toString(),

    title:
      "محادثة جديدة",

    messages: []

  };

  conversations.unshift(
    conversation
  );

  currentConversationId =
    conversation.id;

  saveConversations();

  renderConversationList();

  renderConversation();

  return conversation;

}


/* =========================
   الحصول على الحالية
========================= */

function getCurrentConversation() {

  return conversations.find(
    conversation =>
      conversation.id ===
      currentConversationId
  );

}


/* =========================
   حفظ رسالة
========================= */

function saveMessage(role, text) {

  const conversation =
    getCurrentConversation();

  if (!conversation) {
    return;
  }

  conversation.messages.push({

    role: role,

    text: text

  });


  if (
    role === "user" &&
    conversation.title ===
    "محادثة جديدة"
  ) {

    conversation.title =
      getTitle(text);

  }


  saveConversations();

  renderConversationList();

}


/* =========================
   رسالة على الشاشة
========================= */

function addMessageToScreen(
  role,
  text
) {

  const message =
    document.createElement("div");

  message.className =
    "message " + role;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  message.appendChild(
    bubble
  );

  chat.appendChild(
    message
  );

}


/* =========================
   صورة على الشاشة
========================= */

function addImageToScreen(image) {

  const message =
    document.createElement("div");

  message.className =
    "message ai";

  const container =
    document.createElement("div");

  container.className =
    "image-message";

  const img =
    document.createElement("img");

  img.className =
    "generated-image";

  img.src =
    image;

  img.alt =
    "صورة مولدة بواسطة notwin iA";

  container.appendChild(
    img
  );

  message.appendChild(
    container
  );

  chat.appendChild(
    message
  );

}


/* =========================
   شاشة البداية
========================= */

function showWelcome() {

  chat.innerHTML = `

    <section class="welcome">

      <div class="orb">
        ✦
      </div>

      <h1>
        مرحباً بك في
        <span>notwin iA</span>
      </h1>

      <p>
        مساعدك الذكي للبرمجة، الكتابة، التعلم والأفكار.
      </p>

    </section>

  `;

}


/* =========================
   عرض المحادثة
========================= */

function renderConversation() {

  chat.innerHTML = "";

  const conversation =
    getCurrentConversation();

  if (
    !conversation ||
    !Array.isArray(
      conversation.messages
    ) ||
    conversation.messages.length === 0
  ) {

    showWelcome();

    return;

  }


  conversation.messages.forEach(
    message => {

      if (
        message.role ===
        "image"
      ) {

        addImageToScreen(
          message.text
        );

      } else {

        addMessageToScreen(
          message.role,
          message.text
        );

      }

    }
  );

  scrollToBottom();

}


/* =========================
   النزول لآخر الرسائل
========================= */

function scrollToBottom() {

  setTimeout(() => {

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });

  }, 50);

}


/* =========================
   قائمة المحادثات
========================= */

function renderConversationList() {

  conversationList.innerHTML = "";

  if (conversations.length === 0) {

    conversationList.innerHTML =
      `<div class="empty-chats">
        مازال ما عندك حتى محادثة 💚
      </div>`;

    return;

  }


  conversations.forEach(
    conversation => {

      const item =
        document.createElement("div");

      item.className =
        "conversation";


      if (
        conversation.id ===
        currentConversationId
      ) {

        item.classList.add(
          "active"
        );

      }


      const title =
        document.createElement("div");

      title.className =
        "conversation-title";

      title.textContent =
        "💬 " +
        conversation.title;


      title.addEventListener(
        "click",
        function () {

          currentConversationId =
            conversation.id;

          renderConversation();

          renderConversationList();

          closeSidebar();

        }
      );


      const del =
        document.createElement("button");

      del.className =
        "delete-chat";

      del.type =
        "button";

      del.textContent =
        "🗑️";


      del.addEventListener(
        "click",
        function (event) {

          event.stopPropagation();

          conversations =
            conversations.filter(
              c =>
                c.id !==
                conversation.id
            );


          if (
            currentConversationId ===
            conversation.id
          ) {

            currentConversationId =
              null;

            renderConversation();

          }


          saveConversations();

          renderConversationList();

        }
      );


      item.appendChild(
        title
      );

      item.appendChild(
        del
      );

      conversationList.appendChild(
        item
      );

    }
  );

}


/* =========================
   رسالة خطأ
========================= */

function createErrorBubble() {

  const message =
    document.createElement("div");

  message.className =
    "message ai";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  message.appendChild(
    bubble
  );

  chat.appendChild(
    message
  );


  return bubble;

}


/* =========================
   إرسال الرسالة
========================= */

async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) {
    return;
  }


  console.log(
    "Sending message:",
    text
  );


  if (!currentConversationId) {

    createConversation();

  }


  addMessageToScreen(
    "user",
    text
  );

  saveMessage(
    "user",
    text
  );


  input.value = "";

  input.disabled = true;

  sendButton.disabled = true;

  typing.textContent =
    "notwin iA يكتب...";

  typing.style.display =
    "block";


  scrollToBottom();


  try {

    const response =
      await fetch(
        API_URL + "/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: text
            })
        }
      );


    if (!response.ok) {

      let errorText =
        "";

      try {

        const data =
          await response.json();

        errorText =
          data.error || "";

      } catch (error) {

        console.error(
          "Error reading server response:",
          error
        );

      }


      if (
        response.status ===
        429
      ) {

        throw new Error(
          "DAILY_LIMIT"
        );

      }


      throw new Error(
        errorText ||
        "SERVER_ERROR"
      );

    }


    if (!response.body) {

      throw new Error(
        "NO_STREAM"
      );

    }


    typing.style.display =
      "none";


    const message =
      document.createElement("div");

    message.className =
      "message ai";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    message.appendChild(
      bubble
    );

    chat.appendChild(
      message
    );


    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder("utf-8");

    let fullText =
      "";


    while (true) {

      const result =
        await reader.read();

      if (result.done) {
        break;
      }


      const chunk =
        decoder.decode(
          result.value,
          {
            stream: true
          }
        );


      fullText +=
        chunk;


      bubble.textContent =
        fullText;


      scrollToBottom();

    }


    const finalChunk =
      decoder.decode();

    if (finalChunk) {

      fullText +=
        finalChunk;

      bubble.textContent =
        fullText;

    }


    if (fullText.trim()) {

      saveMessage(
        "ai",
        fullText
      );

    }

  } catch (error) {

    console.error(
      "Chat error:",
      error
    );


    typing.style.display =
      "none";


    const bubble =
      createErrorBubble();


    if (
      error.message ===
      "DAILY_LIMIT"
    ) {

      bubble.textContent =
        "⏳ وصلت للحد الأقصى من المحاولات المجانية اليوم.\nارجع غدًا ونكملو من وين حبستنا 💚";

    } else {

      bubble.textContent =
        "⚙️ صار مشكل في الاتصال بالخدمة.\nتأكد من السيرفر وحاول مرة أخرى 😕";

    }

  } finally {

    input.disabled =
      false;

    sendButton.disabled =
      false;

    input.focus();

  }

}


/* =========================
   توليد الصور
========================= */

async function generateImage() {

  const prompt =
    imagePrompt.value.trim();

  if (!prompt) {
    return;
  }


  if (!currentConversationId) {

    createConversation();

  }


  imagePanel.classList.remove(
    "show"
  );


  typing.textContent =
    "notwin iA يحضر الصورة... 🖼️";

  typing.style.display =
    "block";

  generateButton.disabled =
    true;


  try {

    const response =
      await fetch(
        API_URL +
        "/generate-image",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              prompt: prompt
            })

        }
      );


    let data = {};

    try {

      data =
        await response.json();

    } catch (error) {

      console.error(
        "Image response error:",
        error
      );

    }


    if (!response.ok) {

      if (
        response.status ===
        429
      ) {

        throw new Error(
          "DAILY_LIMIT"
        );

      }


      throw new Error(
        data.error ||
        "IMAGE_ERROR"
      );

    }


    if (!data.image) {

      throw new Error(
        "NO_IMAGE"
      );

    }


    const imageUrl =
      "data:" +
      (data.mimeType || "image/png") +
      ";base64," +
      data.image;


    addImageToScreen(
      imageUrl
    );


    const conversation =
      getCurrentConversation();


    if (conversation) {

      conversation.messages.push({

        role:
          "image",

        text:
          imageUrl

      });


      if (
        conversation.title ===
        "محادثة جديدة"
      ) {

        conversation.title =
          getTitle(prompt);

      }


      saveConversations();

      renderConversationList();

    }


    scrollToBottom();


  } catch (error) {

    console.error(
      "Image error:",
      error
    );


    const bubble =
      createErrorBubble();


    if (
      error.message ===
      "DAILY_LIMIT"
    ) {

      bubble.textContent =
        "🖼️⏳ وصلت للحد المجاني لتوليد الصور اليوم.\nارجع غدًا ونكملو 💚";

    } else {

      bubble.textContent =
        "🖼️❌ ما قدرناش نولد الصورة حالياً.\nعاود المحاولة بعد شوية.";

    }

  } finally {

    typing.style.display =
      "none";

    typing.textContent =
      "notwin iA يكتب...";

    generateButton.disabled =
      false;

    imagePrompt.value =
      "";

  }

}


/* =========================
   زر الإرسال
   مهم جدًا
========================= */

sendButton.addEventListener(
  "click",
  function () {

    sendMessage();

  }
);


/* =========================
   Enter
========================= */

input.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   لوحة الصور
========================= */

imageButton.addEventListener(
  "click",
  function () {

    imagePanel.classList.toggle(
      "show"
    );


    if (
      imagePanel.classList.contains(
        "show"
      )
    ) {

      imagePrompt.focus();

    }

  }
);


/* =========================
   زر توليد الصورة
========================= */

generateButton.addEventListener(
  "click",
  function () {

    generateImage();

  }
);


/* =========================
   Enter في الصور
========================= */

imagePrompt.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      generateImage();

    }

  }
);


/* =========================
   فتح القائمة
========================= */

menuButton.addEventListener(
  "click",
  function () {

    sidebar.classList.add(
      "open"
    );

    overlay.classList.add(
      "show"
    );

  }
);


/* =========================
   غلق القائمة
========================= */

closeMenu.addEventListener(
  "click",
  closeSidebar
);


overlay.addEventListener(
  "click",
  closeSidebar
);


function closeSidebar() {

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );

}


/* =========================
   محادثة جديدة
========================= */

newChatButton.addEventListener(
  "click",
  function () {

    createConversation();

    closeSidebar();

    input.focus();

  }
);


/* =========================
   البداية
========================= */

renderConversationList();


/*
  إذا كان عندنا محادثات محفوظة،
  نفتح آخر محادثة تلقائياً.
*/

if (
  conversations.length > 0
) {

  currentConversationId =
    conversations[0].id;

  renderConversation();

}


/* جاهز */

console.log(
  "notwin iA interface ready ✅"
);

</script>

</body>
</html>
