<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notwin iA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f0d;
      color: #fff;
      min-height: 100vh;
    }

    .app {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #202722;
      background: #0b0f0d;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #19d66b;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #ddd;
      font-size: 22px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: #171d19;
    }

    .chat {
      flex: 1;
      padding: 25px 15px 150px;
      overflow-x: hidden;
    }

    .welcome {
      text-align: center;
      padding: 55px 15px 35px;
    }

    .orb {
      width: 64px;
      height: 64px;
      margin: auto auto 18px;
      border-radius: 50%;
      background: #19d66b;
      color: #07120b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 0 35px rgba(25, 214, 107, .25);
    }

    .welcome h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .welcome h1 span {
      color: #19d66b;
    }

    .welcome p {
      color: #8f9992;
      font-size: 14px;
      line-height: 1.8;
    }

    .message {
      display: flex;
      margin: 18px 0;
      gap: 10px;
      line-height: 1.8;
      font-size: 15px;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #19d66b;
      color: #06120a;
      border-bottom-left-radius: 5px;
    }

    .ai .bubble {
      background: #171c19;
      border: 1px solid #252d28;
      color: #f1f4f2;
      border-bottom-right-radius: 5px;
    }

    .time {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      opacity: .45;
    }

    .typing {
      display: none;
      color: #7d8a82;
      font-size: 13px;
      padding: 5px 18px;
    }

    .input-wrapper {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 100%);
      padding: 12px 14px 18px;
      background: linear-gradient(
        transparent,
        #0b0f0d 25%
      );
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #171c19;
      border: 1px solid #303a33;
      border-radius: 26px;
      padding: 7px;
      box-shadow: 0 5px 30px rgba(0, 0, 0, .3);
    }

    .input-area input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 11px 5px;
      text-align: right;
    }

    .input-area input::placeholder {
      color: #737d76;
    }

    .send {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #19d66b;
      color: #06120a;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send:disabled {
      opacity: .45;
      cursor: default;
    }

    .attach {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #9aa49e;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .attach:hover {
      background: #202722;
    }

    @media (max-width: 600px) {
      .chat {
        padding-left: 10px;
        padding-right: 10px;
      }

      .welcome {
        padding-top: 40px;
      }

      .welcome h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <button class="icon-btn" type="button">☰</button>

      <div class="logo">
        notwin <span>iA</span>
      </div>

      <button class="icon-btn" type="button">◉</button>
    </header>

    <main class="chat" id="chat">

      <section class="welcome" id="welcome">

        <div class="orb">✦</div>

        <h1>
          مرحباً بك في <span>notwin iA</span>
        </h1>

        <p>
          مساعدك الذكي للبرمجة، الكتابة، التعلم والأفكار.
        </p>

      </section>

    </main>

    <div class="typing" id="typing">
      notwin iA يكتب...
    </div>

    <div class="input-wrapper">

      <div class="input-area">

        <button class="attach" type="button">
          +
        </button>

        <input
          id="messageInput"
          type="text"
          placeholder="اكتب رسالتك..."
          autocomplete="off">

        <button
          id="sendButton"
          class="send"
          type="button">
          ↑
        </button>

      </div>

    </div>

  </div>

  <script>

    const API_URL =
      "https://notwin-ia-1.onrender.com/chat";

    const input =
      document.getElementById("messageInput");

    const chat =
      document.getElementById("chat");

    const typing =
      document.getElementById("typing");

    const sendButton =
      document.getElementById("sendButton");

    const welcome =
      document.getElementById("welcome");

    function addUserMessage(text) {

      const message =
        document.createElement("div");

      message.className = "message user";

      const bubble =
        document.createElement("div");

      bubble.className = "bubble";

      bubble.textContent = text;

      message.appendChild(bubble);

      chat.appendChild(message);

      message.scrollIntoView({
        behavior: "smooth",
        block: "end"
      });
    }

    function createAIMessage() {

      const message =
        document.createElement("div");

      message.className = "message ai";

      const bubble =
        document.createElement("div");

      bubble.className = "bubble";

      message.appendChild(bubble);

      chat.appendChild(message);

      return bubble;
    }

    async function sendMessage() {

      const text =
        input.value.trim();

      if (!text) return;

      if (welcome) {
        welcome.style.display = "none";
      }

      addUserMessage(text);

      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;

      typing.style.display = "block";

      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: text
            })

          });

        if (!response.ok) {

          let errorText =
            "حدث خطأ في السيرفر";

          try {

            const errorData =
              await response.json();

            errorText =
              errorData.error || errorText;

          } catch {}

          throw new Error(errorText);
        }

        if (!response.body) {
          throw new Error("Streaming غير متاح");
        }

        typing.style.display = "none";

        const bubble =
          createAIMessage();

        const reader =
          response.body.getReader();

        const decoder =
          new TextDecoder("utf-8");

        let fullText = "";

        while (true) {

          const {
            value,
            done
          } = await reader.read();

          if (done) break;

          const chunk =
            decoder.decode(value, {
              stream: true
            });

          fullText += chunk;

          bubble.textContent =
            fullText;

          bubble.parentElement.scrollIntoView({
            behavior: "smooth",
            block: "end"
          });
        }

      } catch (error) {

        console.error(error);

        typing.style.display = "none";

        const bubble =
          createAIMessage();

        bubble.textContent =
          "صار خطأ في الاتصال بالسيرفر 😕";

      } finally {

        input.disabled = false;
        sendButton.disabled = false;
        input.focus();

      }
    }

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>

</body>

</html>
